name: Private secret scan boundary
on:
  push:
    branches: ['fix/release-scan-root-20261025', 'checkpoint/final-e2e-20260929']
    paths:
      - 'tools/public-release/private-secret-scan.py'
      - 'tools/public-release/private-secret-scan_test.py'
      - '.github/workflows/private-secret-scan.yml'
  pull_request:
    paths:
      - 'tools/public-release/private-secret-scan.py'
      - 'tools/public-release/private-secret-scan_test.py'
      - '.github/workflows/private-secret-scan.yml'
permissions:
  contents: read
jobs:
  boundary:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - name: Reject incomplete candidate trees before reading secrets
        run: python3 tools/public-release/private-secret-scan_test.py
