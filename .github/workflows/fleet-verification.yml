name: Fleet isolated regressions
on:
  pull_request:
    branches: ['checkpoint/final-e2e-20260929']
permissions:
  contents: read
jobs:
  fleet:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      GOMAXPROCS: '2'
      GOMEMLIMIT: 1536MiB
      GOTOOLCHAIN: local
      DOB_TEST_XRAY: /tmp/dob-xray/xray
      DOB_TEST_CHROMIUM: /tmp/dob-chrome/chrome-headless-shell-linux64/chrome-headless-shell
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Prepare isolated dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql postgresql-contrib libasound2t64 libatk-bridge2.0-0t64 libxdamage1 libnss3 libgbm1 xvfb xauth fonts-noto-core fonts-noto-color-emoji
          python3 - <<'PY'
          import hashlib, pathlib, urllib.request, zipfile, io
          payload=urllib.request.urlopen('https://storage.googleapis.com/chrome-for-testing-public/156.0.8078.47/linux64/chrome-headless-shell-linux64.zip',timeout=90).read()
          assert hashlib.sha256(payload).hexdigest()=='0d5acc62c3e213f8c87d3c298d66ffcf9a236d12ea4b9f85318bf85dbc279daa'
          out=pathlib.Path('/tmp/dob-chrome');out.mkdir()
          with zipfile.ZipFile(io.BytesIO(payload)) as archive:
              assert all(not pathlib.Path(x.filename).is_absolute() and '..' not in pathlib.Path(x.filename).parts for x in archive.infolist())
              archive.extractall(out)
          (out/'chrome-headless-shell-linux64/chrome-headless-shell').chmod(0o755)
          payload=urllib.request.urlopen('https://github.com/XTLS/Xray-core/releases/download/v26.9.9/Xray-linux-64.zip',timeout=90).read()
          assert hashlib.sha256(payload).hexdigest()=='1eb9175d0f0a8f8149c9230a7fc5ae66ce332ed20a53155ce61fe62e3f58b7df'
          out=pathlib.Path('/tmp/dob-xray');out.mkdir()
          with zipfile.ZipFile(io.BytesIO(payload)) as archive:
              (out/'xray').write_bytes(archive.read('xray'))
          (out/'xray').chmod(0o755)
          PY
          sudo python3 deploy/provider-browser-runtime.py
      - name: Native isolated provider browser and cookie separation
        run: python3 ops/release/provider-browser-sandbox.py
      - name: Exact source, syntax and browser regressions
        env:
          DOB_RUN_BROWSER_TEST: '1'
          DOB_TEST_CHROMIUM: /tmp/dob-chrome/chrome-headless-shell-linux64/chrome-headless-shell
        run: |
          test "$(git rev-parse HEAD)" = '${{ github.event.pull_request.head.sha }}'
          python3 tools/bounded_openai_review_test.py
          python3 deploy/bootstrap_test.py
          python3 deploy/project_update_test.py
          sudo useradd --system digitaloceanbot
          sudo python3 deploy/static_permissions_test.py
          python3 tools/public-release/transport-regression-gate_test.py
          node web/tests/config-transport.cjs
          node web/tests/config-delete.cjs
          node web/tests/provider-native-config.cjs
          node web/tests/provider-native.cjs
          go test -race -v -count=1 -timeout 3m ./internal/nativebrowser ./internal/adminapi -run "TestNative(Browser|Handshake|Relay)"
          DOB_RUN_BROWSER_TEST=0 go test ./...
          go vet ./...
          node --check web/static/app.js
          node web/tests/database-health.cjs
          node web/tests/account-module-recovery.cjs
          node web/tests/kamatera-catalog.cjs
          DOB_BROWSER_SCREENSHOT_LOG=1 node web/tests/provider-browser.cjs
          node --check web/static/panel-settings.js
          node --check web/static/cloudflare.js
          go test -v -count=3 -p 1 -timeout 5m -run '^TestAccountEditBrowser$' ./internal/adminapi
          go test -v -count=1 -p 1 -timeout 5m -run '^TestNewCloudProviderBrowser$' ./internal/adminapi
          DOB_TEST_AUTH_POPUP_BLOCKED=1 go test -v -count=1 -timeout 5m -run '^TestNewCloudProviderBrowser$' ./internal/adminapi
      - name: Canonical database, native transport and race gate
        run: python3 ops/release/transport-regression-gate.py "$GITHUB_WORKSPACE"
      - name: Disposable backup restore and transaction interruption
        run: python3 ops/release/database-restore-drill.py "$GITHUB_WORKSPACE"
