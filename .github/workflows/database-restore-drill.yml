name: Disposable database restore drill
on:
  workflow_dispatch:
  push:
    branches: ['verify/ssh-restore-drill-20261025']
permissions:
  contents: read
jobs:
  restore:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GOMAXPROCS: '2'
      GOMEMLIMIT: 1536MiB
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
      - name: Install disposable database tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql postgresql-contrib
      - name: Verify restore and failure boundaries
        run: |
          go vet ./ops/release
          python3 ops/release/database-restore-drill.py "$GITHUB_WORKSPACE"
