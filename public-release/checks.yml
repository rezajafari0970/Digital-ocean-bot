name: Source checks
on:
  push:
    branches: [main, stable, 'release-candidate/**']
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
      - name: Regression and static checks
        env:
          GOMAXPROCS: '2'
          GOTOOLCHAIN: local
        run: |
          go test ./...
          go vet ./...
          python3 deploy/bootstrap_test.py
          python3 deploy/project_update_test.py
          sudo useradd --system digitaloceanbot
          sudo python3 deploy/static_permissions_test.py
          bash -n install.sh deploy/*.sh
          node --check web/static/app.js
          node --check web/static/panel-settings.js
          node --check web/static/aws-catalog.js
          node --check web/static/preview-stream.js
          node web/tests/preview-stream.cjs
          node web/tests/aws-catalog.cjs
          node web/tests/account-catalog.cjs
      - name: Verify exported file manifest
        run: python3 release/check-source.py
  install:
    if: startsWith(github.ref, 'refs/heads/release-candidate/')
    # The Ubuntu 24.04 hosted image currently has an unmitigated KHO/CMA
    # anomaly. Keep the host guard and test Ubuntu 24.04 in a real systemd
    # container on an independently checked 22.04 host.
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Prepare checked host and disposable Ubuntu 24.04 guest
        run: |
          sudo python3 deploy/host-memory.py check
          sudo snap install lxd --channel=5.21/stable
          sudo /snap/bin/lxd init --minimal
          sudo /snap/bin/lxc launch ubuntu:24.04 dob-release
          sudo /snap/bin/lxc exec dob-release -- timeout 180 cloud-init status --wait
          sudo /snap/bin/lxc exec dob-release -- bash -ec '. /etc/os-release; test "$ID" = ubuntu; test "$VERSION_ID" = 24.04; test "$(uname -m)" = x86_64; test "$(cat /proc/1/comm)" = systemd'
          sudo /snap/bin/lxc exec dob-release -- env DEBIAN_FRONTEND=noninteractive apt-get update
          sudo /snap/bin/lxc exec dob-release -- env DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends git python3 ca-certificates
      - name: Install exact candidate from restrictive root checkout
        run: |
          archive="$RUNNER_TEMP/dob-release-candidate.tar.gz"
          tar -czf "$archive" -C "$GITHUB_WORKSPACE" .
          chmod 600 "$archive"
          sudo /snap/bin/lxc file push "$archive" dob-release/root/candidate.tar.gz
          sudo /snap/bin/lxc exec dob-release -- bash -ec 'mkdir -m 700 /root/candidate; tar -xzf /root/candidate.tar.gz -C /root/candidate; chown -R root:root /root/candidate; chmod -R go-rwx /root/candidate'
          sudo /snap/bin/lxc exec dob-release -- bash -ec 'test "$(git -C /root/candidate rev-parse HEAD)" = "$1"; cd /root/candidate; python3 release/check-source.py' -- "$GITHUB_SHA"
          sudo /snap/bin/lxc exec dob-release -- env NEEDRESTART_MODE=l bash /root/candidate/install.sh --source /root/candidate
          sudo /snap/bin/lxc exec dob-release -- env GITHUB_ACTIONS=true RUNNER_ENVIRONMENT=github-hosted python3 /root/candidate/deploy/release_smoke.py --revision "$GITHUB_SHA"
      - name: Verify repeated install preserves identity
        run: |
          sudo /snap/bin/lxc exec dob-release -- env GITHUB_ACTIONS=true RUNNER_ENVIRONMENT=github-hosted python3 /root/candidate/deploy/release_smoke.py --before
          sudo /snap/bin/lxc exec dob-release -- env NEEDRESTART_MODE=l bash /root/candidate/install.sh --source /root/candidate
          sudo /snap/bin/lxc exec dob-release -- env GITHUB_ACTIONS=true RUNNER_ENVIRONMENT=github-hosted python3 /root/candidate/deploy/release_smoke.py --revision "$GITHUB_SHA"
      - name: Remove disposable guest
        if: always()
        run: sudo /snap/bin/lxc delete --force dob-release || true
