name: Source checks
on:
  push:
    branches: [main, stable, 'release-candidate/**']
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
      - name: Regression and static checks
        env:
          GOMAXPROCS: '2'
          GOTOOLCHAIN: local
        run: |
          go test ./...
          go vet ./...
          python3 deploy/bootstrap_test.py
          python3 deploy/project_update_test.py
          sudo useradd --system digitaloceanbot
          sudo python3 deploy/static_permissions_test.py
          bash -n install.sh deploy/*.sh
          node --check web/static/app.js
          node --check web/static/panel-settings.js
      - name: Verify exported file manifest
        run: python3 release/check-source.py
  install:
    if: startsWith(github.ref, 'refs/heads/release-candidate/')
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Install exact candidate from restrictive root checkout
        run: |
          candidate="$RUNNER_TEMP/dob-release-candidate"
          sudo cp -a "$GITHUB_WORKSPACE" "$candidate"
          sudo chown -R root:root "$candidate"
          sudo chmod -R go-rwx "$candidate"
          sudo env NEEDRESTART_MODE=l bash "$candidate/install.sh" --source "$candidate"
          sudo env GITHUB_ACTIONS=true RUNNER_ENVIRONMENT=github-hosted python3 "$candidate/deploy/release_smoke.py" --revision "$GITHUB_SHA"
      - name: Verify repeated install preserves identity
        run: |
          candidate="$RUNNER_TEMP/dob-release-candidate"
          sudo env GITHUB_ACTIONS=true RUNNER_ENVIRONMENT=github-hosted python3 "$candidate/deploy/release_smoke.py" --before
          sudo env NEEDRESTART_MODE=l bash "$candidate/install.sh" --source "$candidate"
          sudo env GITHUB_ACTIONS=true RUNNER_ENVIRONMENT=github-hosted python3 "$candidate/deploy/release_smoke.py" --revision "$GITHUB_SHA"
