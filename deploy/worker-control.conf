[Service]
Type=notify
NotifyAccess=main
WatchdogSec=45
WatchdogSignal=SIGKILL
TimeoutStartSec=15min
RestartSec=15
ExecStart=
ExecStart=/opt/digital-ocean-bot/bin/digital-ocean-bot-worker --role=control
TimeoutStopSec=90
KillMode=control-group
MemoryHigh=256M
MemoryMax=512M
TasksMax=256
LimitNOFILE=8192
